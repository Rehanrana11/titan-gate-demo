name: Titan Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install titan-gate
        run: pip install titan-gate==1.0.1
      - name: Show receipt store
        run: ls .titan/receipts/ || echo 'No receipts yet'
